<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenticular — ภาพที่เปลี่ยนตามมุมเอียง</title>
<style>
:root{--bg:#f3f1ee;--surf:#fff;--ink:#1b1a1f;--mut:#6c6a73;--line:#d9d6d0;--acc:#2f4bff;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--surf:#1c1c22;--ink:#f1f0f4;--mut:#9a98a3;--line:#33323b;--acc:#7d90ff;--on:#0b0b10}}
:root[data-theme="dark"]{--bg:#121216;--surf:#1c1c22;--ink:#f1f0f4;--mut:#9a98a3;--line:#33323b;--acc:#7d90ff;--on:#0b0b10}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai","Sarabun",system-ui,sans-serif;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px;font-weight:700}
p.lead{margin:0 0 18px;color:var(--mut)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,auto);gap:10px;margin-bottom:16px}
.tile{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:12px;background:var(--surf);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;overflow:hidden;color:var(--mut);font-size:13px;padding:0;font-family:inherit}
.tile .ic{font-size:26px;color:var(--ink)}
.tile.has{border-style:solid;border-color:var(--acc)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.tile .x{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.c{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:600 16px inherit;font-family:inherit;cursor:pointer;padding:0 16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{color:var(--mut);font-size:13px;margin-top:14px}
#view{position:fixed;inset:0;background:#000;display:none;z-index:5;touch-action:none}
#view.on{display:block}
canvas{position:absolute;inset:0;width:100%;height:100%}
.bar{position:absolute;left:0;right:0;display:flex;gap:8px;padding:10px 12px;align-items:center;color:#fff;z-index:2}
.bar.top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bar.bot{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.vb{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;font:14px inherit;font-family:inherit;cursor:pointer}
.bar label{font-size:13px;background:rgba(0,0,0,.55);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:center;flex:1}
.bar input{flex:1;min-width:0}
#dot{position:absolute;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:46px;height:46px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(0,0,0,.35);z-index:2}
#dot i{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:18px;top:18px}
</style>
</head>
<body>
<main>
  <h1>Lenticular แบบเอียงดู</h1>
  <p class="lead">ใส่ภาพ 2–5 ภาพในตำแหน่งที่ต้องการ แล้วเอียงโทรศัพท์เพื่อสลับภาพ</p>
  <div class="pad" id="pad"></div>
  <div class="row">
    <button class="btn" id="demo">ลองภาพตัวอย่าง</button>
    <button class="btn pri" id="go" disabled>เริ่มดู</button>
  </div>
  <p class="note" id="hint">ต้องมีอย่างน้อย 2 ภาพ ภาพจะถูกครอบให้เต็มจอ ควรใช้ภาพแนวตั้งหรืออัตราส่วนใกล้เคียงกัน</p>
</main>

<div id="view">
  <canvas id="cv"></canvas>
  <div class="bar top"><button class="vb" id="close">ปิด</button><button class="vb" id="cal">ตั้งมุมนี้เป็นกลาง</button></div>
  <div id="dot"><i></i></div>
  <div class="bar bot"><label>มุมเอียง <input type="range" id="rng" min="10" max="45" value="22"></label></div>
</div>

<script>
const SLOTS=[["u","ด้านบน","▲"],["l","ซ้าย","◀"],["c","ตรงหน้า","●"],["r","ขวา","▶"],["d","ด้านล่าง","▼"]];
const ANCH={c:[0,0],l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]};
const imgs={};
const pad=document.getElementById("pad"), go=document.getElementById("go");

function render(){
  pad.innerHTML="";
  SLOTS.forEach(([k,name,ic])=>{
    const t=document.createElement("button");
    t.className="tile "+k+(imgs[k]?" has":"");
    if(imgs[k]){
      t.innerHTML='<img alt="">';t.firstChild.src=imgs[k].src;
      t.insertAdjacentHTML("beforeend",'<span class="tag">'+name+'</span><span class="x" role="button" aria-label="ลบ">×</span>');
      t.querySelector(".x").onclick=e=>{e.stopPropagation();delete imgs[k];render();};
    }else{
      t.innerHTML='<span class="ic">'+ic+'</span><span>'+name+'</span>';
    }
    t.onclick=()=>pick(k);
    pad.appendChild(t);
  });
  const n=Object.keys(imgs).length;
  go.disabled=n<2;
}
function pick(k){
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{imgs[k]=im;render();};im.src=r.result;};
    r.readAsDataURL(file);
  };
  f.click();
}
document.getElementById("demo").onclick=()=>{
  const cols={u:["#ff9a3c","#ffd86b","ขึ้น"],l:["#2f6bff","#8ec5ff","ซ้าย"],c:["#1d1d24","#5b5b6b","ตรง"],r:["#e23c7a","#ff9fc4","ขวา"],d:["#18a35a","#9be8b8","ลง"]};
  for(const k in cols){
    const c=document.createElement("canvas");c.width=600;c.height=800;const x=c.getContext("2d");
    const g=x.createLinearGradient(0,0,600,800);g.addColorStop(0,cols[k][0]);g.addColorStop(1,cols[k][1]);
    x.fillStyle=g;x.fillRect(0,0,600,800);
    x.fillStyle="rgba(255,255,255,.9)";x.font="700 180px 'Noto Sans Thai',sans-serif";x.textAlign="center";x.textBaseline="middle";
    x.fillText(cols[k][2],300,400);
    const im=new Image();im.onload=()=>{imgs[k]=im;render();};im.src=c.toDataURL();
  }
};

/* ---- viewer ---- */
const view=document.getElementById("view"),cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const dot=document.querySelector("#dot i"),rng=document.getElementById("rng");
let W=0,H=0,tx=0,ty=0,cx=0,cy=0,b0=null,g0=null,lastB=0,lastG=0,gyro=false,running=false;
const clamp=v=>Math.max(-1,Math.min(1,v));

function size(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;}
addEventListener("resize",size);

function onOri(e){
  if(e.beta==null||e.gamma==null)return;
  gyro=true;lastB=e.beta;lastG=e.gamma;
  if(b0===null){b0=lastB;g0=lastG;}
  const R=+rng.value;
  tx=clamp((lastG-g0)/R);ty=clamp((lastB-b0)/R);
}
document.getElementById("cal").onclick=()=>{b0=lastB;g0=lastG;};
function onPtr(e){
  if(gyro)return;
  if(e.pointerType!=="mouse"&&!e.buttons&&e.type!=="pointerdown")return;
  tx=clamp(e.clientX/innerWidth*2-1);ty=clamp(e.clientY/innerHeight*2-1);
}
view.addEventListener("pointermove",onPtr);view.addEventListener("pointerdown",onPtr);

go.onclick=async()=>{
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=="granted"){document.getElementById("hint").textContent="ไม่ได้รับสิทธิ์เซ็นเซอร์ ใช้การลากนิ้วบนจอแทนได้";}
    }
  }catch(e){}
  addEventListener("deviceorientation",onOri);
  b0=null;gyro=false;tx=ty=cx=cy=0;
  view.classList.add("on");size();
  if(!running){running=true;requestAnimationFrame(loop);}
};
document.getElementById("close").onclick=()=>{view.classList.remove("on");removeEventListener("deviceorientation",onOri);running=false;};

function cover(im){
  const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;
  ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);
}
function loop(){
  if(!running)return;
  cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;
  const keys=Object.keys(imgs),ws={};let sum=0;
  keys.forEach(k=>{
    let d=Math.hypot(cx-ANCH[k][0],cy-ANCH[k][1]);
    if(k==="c")d=Math.max(0,d-.28);
    ws[k]=Math.exp(-9*d*d);sum+=ws[k];
  });
  ctx.globalAlpha=1;ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  let acc=0;
  keys.sort((a,b)=>ws[a]-ws[b]).forEach(k=>{
    const w=ws[k]/sum;if(w<.003)return;
    acc+=w;ctx.globalAlpha=w/acc;cover(imgs[k]);
  });
  ctx.globalAlpha=1;
  /* lenticular sheen */
  const gr=ctx.createLinearGradient(W*(.5+cx*.6)-W*.5,0,W*(.5+cx*.6)+W*.5,H*.4);
  gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(.5,"rgba(255,255,255,.09)");gr.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  dot.style.left=(18+cx*18)+"px";dot.style.top=(18+cy*18)+"px";
  requestAnimationFrame(loop);
}
render();
</script>
</body>
</html>
